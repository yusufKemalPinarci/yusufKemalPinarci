  </pattern>
  <radialGradient id="fade" cx=".35" cy=".5" r=".75">
    <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0B0A16" stop-opacity=".9"/>
  </radialGradient>
  <clipPath id="card"><rect width="1200" height="440" rx="28"/></clipPath>
  <clipPath id="ty0"><rect x="92" y="356" width="0" height="32"><animate attributeName="width" values="0;0;479.4;479.4;0;0" keyTimes="0.0000;0.0133;0.1400;0.2800;0.3200;1.0000" dur="15.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="ty1"><rect x="92" y="356" width="0" height="32"><animate attributeName="width" values="0;0;448.8;448.8;0;0" keyTimes="0.0000;0.3467;0.4733;0.6133;0.6533;1.0000" dur="15.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="ty2"><rect x="92" y="356" width="0" height="32"><animate attributeName="width" values="0;0;448.8;448.8;0;0" keyTimes="0.0000;0.6800;0.8067;0.9467;0.9867;1.0000" dur="15.0s" repeatCount="indefinite"/></rect></clipPath>
</defs>

<g clip-path="url(#card)">

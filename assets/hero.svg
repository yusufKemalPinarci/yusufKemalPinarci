<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<defs>
  
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#A78BFA"/>
  <stop offset=".5" stop-color="#F472B6"/>
  <stop offset="1" stop-color="#34D399"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="10s" repeatCount="indefinite"/>
</linearGradient>
  
<linearGradient id="brandS" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#A78BFA"/>
  <stop offset=".5" stop-color="#F472B6"/>
  <stop offset="1" stop-color="#34D399"/>
  
</linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
